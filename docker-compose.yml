services:
  docchat:
    build: .
    image: docchat:latest
    container_name: docchat
    # Secrets are read from .env.local at runtime (not baked into the image).
    env_file:
      - .env.local
    ports:
      - "3001:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
